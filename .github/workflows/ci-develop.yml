# ============================================================
# CI — Rama DEVELOP (Staging)
# Se ejecuta en: push a develop, y en PRs hacia develop
# Corre auth + smoke + todos (NO failures — ese va en ci-failures.yml)
# ============================================================

name: 🧪 CI — Develop (Staging)

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  cypress-staging:
    name: Cypress Tests (Staging)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: ⚙️  Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Instalar dependencias
        run: npm ci

      - name: 🏗️  Build de la app (Staging)
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}

      - name: 🌲 Cypress — Correr tests (Staging)
        uses: cypress-io/github-action@v6
        with:
          start: npm run preview -- --port 5173
          
          #wait-on: 'http://localhost:5173'
          wait-on: 'https://taskflow-sooty-pi.vercel.app/app'
          wait-on-timeout: 60
          # Excluye failures.cy.js — ese corre en ci-failures.yml separado
          spec: cypress/e2e/auth.cy.js,cypress/e2e/smoke.cy.js,cypress/e2e/todos.cy.js
          record: true
          tag: staging,develop
        env:
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          CYPRESS_PROJECT_ID: ${{ secrets.CYPRESS_PROJECT_ID }}
          CYPRESS_TEST_EMAIL: ${{ secrets.STAGING_TEST_EMAIL }}
          CYPRESS_TEST_PASSWORD: ${{ secrets.STAGING_TEST_PASSWORD }}
          VITE_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}

      - name: 📸 Subir screenshots en fallos
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots-staging
          path: cypress/screenshots
          retention-days: 7
