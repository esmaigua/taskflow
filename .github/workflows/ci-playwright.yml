# ══════════════════════════════════════════════════════════════
# CI — Playwright + Benchmark Comparativo
# Corre en paralelo con ci-develop para medir diferencias reales
# Genera reporte automático Cypress vs Playwright
# ══════════════════════════════════════════════════════════════

name: 🎭 Playwright + Benchmark Comparativo

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

jobs:
  playwright:
    name: Playwright Tests
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Instalar dependencias
        run: npm ci

      # Instalar navegadores de Playwright (Chromium + Firefox)
      - name: 🌐 Instalar navegadores de Playwright
        run: npx playwright install --with-deps chromium firefox

      - name: 🏗️ Build de la app
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}

      # Levantar el servidor en background y esperar que esté listo
      - name: 🚀 Levantar servidor de preview
        run: |
          npm run preview -- --port 5173 &
          npx wait-on http://localhost:5173 --timeout 60000

      - name: 🎭 Correr tests de Playwright
        run: npx playwright test
        env:
          TEST_EMAIL: ${{ secrets.STAGING_TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.STAGING_TEST_PASSWORD }}
          CI: true

      # Guardar resultados JSON para el benchmark
      - name: 📁 Subir resultados de Playwright
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results
          path: |
            playwright-results.json
            playwright-report/
          retention-days: 7

      # Resumen en GitHub Actions
      - name: 📝 Resumen de Playwright
        if: always()
        run: |
          echo "## 🎭 Playwright Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f playwright-results.json ]; then
            echo "Resultados disponibles en artifacts." >> $GITHUB_STEP_SUMMARY
          fi

  # Job separado que corre DESPUÉS de que Playwright termina
  # Descarga resultados y genera el reporte comparativo
  benchmark:
    name: Benchmark Cypress vs Playwright
    runs-on: ubuntu-latest
    needs: playwright   # espera a que Playwright termine
    if: always()        # corre aunque Playwright falle

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Descargar resultados de Playwright del job anterior
      - name: 📥 Descargar resultados de Playwright
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: playwright-results

      # Generar el reporte comparativo
      - name: 📊 Generar benchmark comparativo
        run: node scripts/benchmark.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      # Publicar el reporte como artifact descargable
      - name: 📁 Subir reporte de benchmark
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-report-${{ github.run_number }}
          path: benchmark-report.md
          retention-days: 30

      # Mostrar el reporte directamente en GitHub Actions UI
      - name: 📝 Publicar benchmark en GitHub Summary
        if: always()
        run: |
          if [ -f benchmark-report.md ]; then
            cat benchmark-report.md >> $GITHUB_STEP_SUMMARY
          else
            echo "## ⚠️ Benchmark no generado" >> $GITHUB_STEP_SUMMARY
          fi
